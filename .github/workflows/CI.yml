name: CI/CD - Build & Package Extension

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Jest cache
        run: npm run testCacheCreate
        continue-on-error: true

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Clean build directory
        run: |
          rm -f build_dir/tsconfig.tsbuildinfo

      - name: Extract Extension Version
        id: ext_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Release tag detected: $GITHUB_REF_NAME -> version: $TAG_VERSION"
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('./build_dir/manifest.json', 'utf8'));
              m.version = '$TAG_VERSION';
              fs.writeFileSync('./build_dir/manifest.json', JSON.stringify(m, null, 4));
            "
            VERSION="$TAG_VERSION"
          else
            VERSION=$(node -p "require('./build_dir/manifest.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Tab Suspender version: $VERSION"

      - name: Package extension as zip
        run: |
          cd build_dir
          zip -r ../tab-suspender-v${{ env.VERSION }}-unpacked.zip .
          cd ..

      - name: Upload Unpacked Directory Artifact (Load unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: tab-suspender-v${{ env.VERSION }}-unpacked
          path: build_dir/
          if-no-files-found: error

      - name: Upload Extension Zip Archive
        uses: actions/upload-artifact@v4
        with:
          name: tab-suspender-v${{ env.VERSION }}-zip
          path: tab-suspender-v${{ env.VERSION }}-unpacked.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: tab-suspender-v${{ env.VERSION }}-unpacked.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true

  puppeteer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Cache Puppeteer browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('test/puppeteer/package-lock.json') }}

      - name: Install Puppeteer test dependencies
        run: npm ci
        working-directory: test/puppeteer

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run suspend-discard integration test
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac &
          sleep 1
          DISPLAY=:99 npx tsx suspend-discard.test.ts
        working-directory: test/puppeteer

      - name: Run corrupt-storage regression test
        run: DISPLAY=:99 npx tsx corrupt-storage.test.ts
        working-directory: test/puppeteer

      - name: Run basic suspend/restore test
        run: DISPLAY=:99 npx tsx basic-suspend-restore.test.ts
        working-directory: test/puppeteer

      - name: Run auto-restore tab test
        run: DISPLAY=:99 npx tsx auto-restore-tab.test.ts
        working-directory: test/puppeteer

      - name: Run restore modes test
        run: DISPLAY=:99 npx tsx restore-modes.test.ts
        working-directory: test/puppeteer

      - name: Run form data restore test
        run: DISPLAY=:99 npx tsx form-data-restore.test.ts
        working-directory: test/puppeteer

      - name: Run protected URLs test
        run: DISPLAY=:99 npx tsx protected-urls.test.ts
        working-directory: test/puppeteer

      - name: Run whitelist/ignore test
        run: DISPLAY=:99 npx tsx whitelist-ignore.test.ts
        working-directory: test/puppeteer

      - name: Run favicon loss test
        run: DISPLAY=:99 npx tsx favicon-loss.test.ts
        working-directory: test/puppeteer

      - name: Run favicon navigation stress test
        run: DISPLAY=:99 npx tsx favicon-nav-stress.test.ts
        working-directory: test/puppeteer

      - name: Run screenshot settings test
        run: DISPLAY=:99 npx tsx screenshot-settings.test.ts
        working-directory: test/puppeteer

      - name: Run discard tab ID change test
        run: DISPLAY=:99 npx tsx discard-tab-id-change.test.ts
        working-directory: test/puppeteer

      - name: Run unfocused tab discard test
        run: DISPLAY=:99 npx tsx unfocused-tab-discard.test.ts
        working-directory: test/puppeteer

      - name: Run start discarded test
        run: DISPLAY=:99 npx tsx start-discarded.test.ts
        working-directory: test/puppeteer

      - name: Run bulk tab operations test
        run: DISPLAY=:99 npx tsx bulk-tab-operations.test.ts
        working-directory: test/puppeteer

      - name: Run adaptive timeout test
        run: DISPLAY=:99 npx tsx adaptive-timeout.test.ts
        working-directory: test/puppeteer

      - name: Run pinned tab protection test
        run: DISPLAY=:99 npx tsx pinned-tab-protection.test.ts
        working-directory: test/puppeteer